[package]
name = "harness-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider-neutral runtime foundations for the Agent Harness"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"

